<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100" role="img" aria-labelledby="title desc">
  <title id="title">Curious. Always exploring.</title>
  <desc id="desc">A looping typewriter greeting. This decorative animation does not use contribution data.</desc>
  <defs>
    <linearGradient id="edge" x2="1" y2="1">
      <stop stop-color="#43d9ff" stop-opacity=".42"/><stop offset="1" stop-color="#ab7aff" stop-opacity=".3"/>
    </linearGradient>
    <clipPath id="type-line"><rect class="reveal" x="148" y="24" width="604" height="54"/></clipPath>
  </defs>
  <style>
    .reveal { transform-origin:148px 50px; animation:typing 12s steps(25,end) infinite; }
    .cursor-track { animation:cursor-travel 12s steps(25,end) infinite; }
    .cursor { animation:blink 1.1s step-end infinite; }
    @keyframes typing { 0%,7% {transform:scaleX(0)} 42%,83% {transform:scaleX(1)} 97%,100% {transform:scaleX(0)} }
    @keyframes cursor-travel { 0%,7% {transform:translateX(0)} 42%,83% {transform:translateX(604px)} 97%,100% {transform:translateX(0)} }
    @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
    @media (prefers-reduced-motion:reduce) {
      .reveal,.cursor-track,.cursor {animation:none}
      .cursor-track {transform:translateX(604px)}
      .cursor {opacity:.65}
    }
  </style>
  <rect x="1" y="1" width="898" height="98" rx="18" fill="#0b1125" stroke="url(#edge)"/>
  <path d="m76 41 10 10-10 10M96 63h14" fill="none" stroke="#66e2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="63" fill="#e9efff" font-family="Consolas, 'Courier New', monospace" font-size="36" textLength="604" lengthAdjust="spacingAndGlyphs" clip-path="url(#type-line)">Curious. Always exploring.</text>
  <g class="cursor-track"><rect class="cursor" x="756" y="32" width="3" height="37" fill="#79e8ff" transform="translate(-604 0)"/></g>
  <circle cx="846" cy="50" r="4" fill="#ab88ff"/>
</svg>

      </g>
      <g class="space-flame">
        <path d="M169 202H182V194H202V186H233V225H202V217H182V209H169Z" fill="#9c70ff" fill-opacity=".55"/>
        <path d="M192 202H210V194H240V217H210V210H192Z" fill="#63d8ff"/>
        <path d="M211 201H241V210H211Z" fill="#e3fcff"/>
      </g>
      <path d="M250 173H265V166H287V174H306V186H331V194H354V210H331V220H306V233H288V244H267V236H250V222H235V187H250Z" fill="#0d1a33" stroke="#9bdeff" stroke-width="2"/>
      <path d="M251 185H269V176H290V185H311V194H339V211H310V220H289V230H269V222H251Z" fill="#d9f1ff"/>
      <path d="M268 176V154H285V164H297V185H288V194H268Z" fill="#768bf1"/>
      <path d="M268 220H289V229H297V246H284V256H267V231Z" fill="#768bf1"/>
      <path d="M275 154H285V164H292V173H280V181H268V176H275Z" fill="#a4a7ff"/>
      <path d="M268 232H280V241H292V246H284V256H267Z" fill="#526dc4"/>
      <path d="M291 192H318V213H291V207H283V199H291Z" fill="#183762"/>
      <path d="M294 195H312V201H294Z" fill="#65dcff"/>
      <path d="M297 204H317V210H297Z" fill="#3697cc"/>
      <path d="M253 190H265V220H253Z" fill="#83c7f0"/>
      <path d="M330 197H345V207H330Z" fill="#a0dfff"/>
      <rect x="240" y="195" width="8" height="20" fill="#7c89d6"/>
    </g>
    <path d="M40 314H76M1124 314H1160" stroke="#78a1d8" stroke-opacity=".4" stroke-width="2"/>
    <path d="M581 313H585M592 313H596M603 313H607M614 313H618" stroke="#85b3ed" stroke-opacity=".55" stroke-width="3"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="338.5" rx="22" stroke="#789bd6" stroke-opacity=".25" stroke-width="1.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="space-title space-desc">
  <title id="space-title">Space Loop — decorative arcade animation</title>
  <desc id="space-desc">A small pixel spaceship floats through moving stars, glowing pickups and asteroids beside an orbiting moon. This automatic decorative loop is not interactive and is independent of commits, contributions or other activity.</desc>
  <defs>
    <linearGradient id="space-surface" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071225"/>
      <stop offset=".56" stop-color="#101a39"/>
      <stop offset="1" stop-color="#1b1034"/>
    </linearGradient>
    <radialGradient id="space-nebula" cx="0" cy="0" r="1" gradientTransform="translate(898 177) rotate(168) scale(436 229)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b4bfa" stop-opacity=".19"/>
      <stop offset="1" stop-color="#8b4bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="space-planet" x1="840" y1="134" x2="975" y2="251" gradientUnits="userSpaceOnUse">
      <stop stop-color="#aa8bff"/>
      <stop offset=".45" stop-color="#755ce7"/>
      <stop offset="1" stop-color="#323879"/>
    </linearGradient>
    <linearGradient id="space-trail" x1="66" y1="0" x2="241" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#977bff" stop-opacity="0"/>
      <stop offset="1" stop-color="#68dcff" stop-opacity=".7"/>
    </linearGradient>
    <clipPath id="space-clip"><rect x="1" y="1" width="1198" height="338" rx="22"/></clipPath>
    <clipPath id="space-planet-clip">
      <path d="M886 128H932V137H950V146H968V164H977V218H968V236H950V245H932V254H886V245H868V236H850V218H841V164H850V146H868V137H886Z"/>
    </clipPath>
    <g id="space-stars-a" fill="#93b7ef">
      <path d="M29 123h2v2h-2zm77 140h3v3h-3zm72-163h2v2h-2zm73 189h2v2h-2zm166-167h3v3h-3zm48 126h2v2h-2zm98-147h2v2h-2zm48 184h3v3h-3zm137-149h2v2h-2zm38 114h2v2h-2zm253-147h2v2h-2zm93 189h3v3h-3zm42-120h2v2h-2zm-970 44h2v2h-2zm361-41h2v2h-2zm348 12h2v2h-2z"/>
    </g>
    <g id="space-stars-b" fill="#d1f6ff">
      <path d="M90 184h5v2h-5zm48-59h3v3h-3zm184 128h5v2h-5zm164-67h3v3h-3zm199-91h5v2h-5zm62 158h3v3h-3zm346-80h5v2h-5zm-29 92h3v3h-3z"/>
      <path d="M395 91v12m-6-6h12m389 180v10m-5-5h10m323-185v10m-5-5h10" stroke="#83bdff" stroke-width="2"/>
    </g>
    <g id="space-pickup">
      <path d="M0-11H5V-5H11V0H16V5H11V11H5V16H0V11H-6V5H-11V0H-6V-5H0Z" fill="#6de9ff" fill-opacity=".1"/>
      <path d="M0-6H5V0H11V5H5V11H0V5H-6V0H0Z" stroke="#72ebff" stroke-width="2"/>
      <rect x="0" width="5" height="5" fill="#d9fbff"/>
    </g>
  </defs>
  <style>
    .space-distant { animation: space-scroll 38s linear infinite; }
    .space-near { animation: space-scroll 19s linear infinite; }
    .space-ship { animation: space-hover 5s ease-in-out infinite; }
    .space-flame { transform-box: fill-box; transform-origin: right center; animation: space-thrust .7s ease-in-out infinite alternate; }
    .space-wake { animation: space-wake 2.4s ease-in-out infinite; }
    .space-orbit { transform-origin: 909px 191px; animation: space-orbit 18s linear infinite; }
    .space-pickup-one { animation: space-bob 3s ease-in-out infinite; }
    .space-pickup-two { animation: space-bob 3s ease-in-out -.8s infinite; }
    .space-pickup-three { animation: space-bob 3s ease-in-out -1.6s infinite; }
    .space-rock-one { animation: space-rock-drift 12s ease-in-out infinite; }
    .space-rock-two { animation: space-rock-drift 15s ease-in-out -5s infinite; }
    .space-spin { transform-box: fill-box; transform-origin: center; animation: space-spin 26s linear infinite; }
    .space-beacon { animation: space-beacon 2.8s ease-in-out infinite; }
    @keyframes space-scroll { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes space-hover { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(9px, -10px); } }
    @keyframes space-thrust { from { transform: scaleX(.62); opacity: .65; } to { transform: scaleX(1); opacity: 1; } }
    @keyframes space-wake { 0%, 100% { opacity: .32; } 50% { opacity: .75; } }
    @keyframes space-orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes space-bob { 0%, 100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(-8px); opacity: 1; } }
    @keyframes space-rock-drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-25px, 12px); } }
    @keyframes space-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes space-beacon { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .space-distant, .space-near, .space-ship, .space-flame, .space-wake, .space-orbit,
      .space-pickup-one, .space-pickup-two, .space-pickup-three, .space-rock-one,
      .space-rock-two, .space-spin, .space-beacon { animation: none; }
    }
  </style>
  <g clip-path="url(#space-clip)">
    <rect width="1200" height="340" fill="url(#space-surface)"/>
    <rect width="1200" height="340" fill="url(#space-nebula)"/>
    <path d="M0 302H1200M0 303L1200 303" stroke="#8796e9" stroke-opacity=".12"/>
    <path d="M40 71H1160" stroke="#90b9ef" stroke-opacity=".13"/>
    <g font-family="'Segoe UI', Arial, sans-serif">
      <text x="65" y="46" fill="#e5efff" font-size="17" font-weight="700" letter-spacing="3.4">SPACE LOOP</text>
      <rect x="1040" y="23" width="119" height="30" rx="15" fill="#122e41" stroke="#4ddcf4" stroke-opacity=".35"/>
      <circle class="space-beacon" cx="1057" cy="38" r="3" fill="#7cf5dd"/>
      <text x="1103" y="42" text-anchor="middle" fill="#a8e8ef" font-size="11" font-weight="600" letter-spacing="1.5">AUTO PLAY</text>
    </g>
    <path d="M39 31H46V38H53V45H46V52H39V45H32V38H39Z" fill="#75ddff"/>
    <g opacity=".5" class="space-distant">
      <use href="#space-stars-a"/>
      <use href="#space-stars-a" x="1200"/>
    </g>
    <g opacity=".75" class="space-near">
      <use href="#space-stars-b"/>
      <use href="#space-stars-b" x="1200"/>
    </g>
    <g opacity=".7">
      <circle cx="909" cy="191" r="107" stroke="#b49bff" stroke-opacity=".15" stroke-dasharray="2 8"/>
      <ellipse cx="909" cy="191" rx="143" ry="51" transform="rotate(-24 909 191)" stroke="#b291ff" stroke-opacity=".4"/>
      <ellipse cx="909" cy="191" rx="146" ry="54" transform="rotate(-24 909 191)" stroke="#80dcff" stroke-opacity=".13"/>
    </g>
    <g clip-path="url(#space-planet-clip)">
      <rect x="841" y="128" width="136" height="126" fill="url(#space-planet)"/>
      <path d="M841 161H905V152H941V143H977M841 189H884V180H947V171H977M841 230H865V221H925V212H977" stroke="#bda7ff" stroke-width="9" stroke-opacity=".24"/>
      <path d="M904 128H932V137H950V146H968V164H977V218H968V236H950V245H932V254H904V245H928V227H946V173H937V146H904Z" fill="#111c4e" fill-opacity=".26"/>
      <path d="M870 149H886V143H904" stroke="#ded5ff" stroke-width="5" stroke-opacity=".7"/>
      <rect x="853" y="172" width="6" height="16" fill="#ded5ff" fill-opacity=".55"/>
    </g>
    <path d="M786 224C798 234 846 235 912 208C970 184 1008 156 1027 140" stroke="#b3a2ff" stroke-width="3" stroke-linecap="round" stroke-opacity=".75"/>
    <path d="M800 229C833 232 874 223 902 212" stroke="#70e3ff" stroke-width="3" stroke-linecap="round" stroke-opacity=".75"/>
    <g class="space-orbit">
      <circle cx="909" cy="84" r="11" fill="#75dff6" fill-opacity=".08"/>
      <path d="M905 78H913V81H916V87H913V90H905V87H902V81H905Z" fill="#93edff"/>
      <rect x="905" y="81" width="4" height="3" fill="#e4fcff"/>
      <rect x="910" y="85" width="3" height="3" fill="#4c82bb"/>
    </g>
    <g transform="translate(583 127)" opacity=".8">
      <g class="space-rock-one">
        <g class="space-spin">
          <path d="M-11-16H7V-11H17V4H12V14H-3V18H-15V7H-20V-7H-11Z" fill="#354461" stroke="#657896" stroke-width="2"/>
          <path d="M-9-8H0V-2H-9ZM3 4H10V10H3Z" fill="#1b2a47"/>
          <path d="M-9-14H5" stroke="#8799b5" stroke-width="2"/>
        </g>
      </g>
    </g>
    <g transform="translate(1104 259)" opacity=".6">
      <g class="space-rock-two">
        <g class="space-spin">
          <path d="M-9-12H6V-7H12V7H6V12H-8V6H-14V-5H-9Z" fill="#444064" stroke="#8175ac" stroke-width="2"/>
          <path d="M-4-5H3V2H-4Z" fill="#272642"/>
        </g>
      </g>
    </g>
    <g transform="translate(494 207)"><g class="space-pickup-one"><use href="#space-pickup"/></g></g>
    <g transform="translate(579 207)"><g class="space-pickup-two"><use href="#space-pickup"/></g></g>
    <g transform="translate(664 207)"><g class="space-pickup-three"><use href="#space-pickup"/></g></g>
    <g class="space-ship">
      <g class="space-wake" stroke="url(#space-trail)" stroke-width="2">

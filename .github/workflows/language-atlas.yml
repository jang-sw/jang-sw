name: Refresh Language Atlas

on:
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * 2' # Wednesdays, 04:23 Asia/Seoul
  push:
    branches: [main]
    paths:
      - '.github/workflows/language-atlas.yml'
      - 'scripts/language_atlas.py'
      - 'tests/test_language_atlas.py'

permissions:
  contents: read

concurrency:
  group: language-atlas
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'jang-sw/jang-sw' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Test the generator
        run: python3 -m unittest discover -s tests -v
      - name: Read public repository languages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/language_atlas.py --owner jang-sw --root .
      - name: Publish only changed generated files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- README.md README.ja.md data/languages.json assets/language-atlas.svg
          if git diff --cached --quiet; then
            echo 'Language Atlas is already current; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh repository language atlas'
          gh auth setup-git --hostname github.com
          git push origin HEAD:main
